name: Release app

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Release and tag name."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Real signing key comes from repo secrets. When the secrets are not configured,
      # the build falls back to the debug keystore (build.gradle.kts handles both).
      - name: Setup release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No RELEASE_KEYSTORE secret; the release APK will be debug-signed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          ALIAS="${KEY_ALIAS:-cloudy}"
          keytool -list -keystore release.jks -storepass "$STORE_PASS" >/tmp/ks_list.txt 2>&1 || {
            echo "::error::Cannot open keystore. Check RELEASE_KEYSTORE and KEYSTORE_PASSWORD secrets."
            cat /tmp/ks_list.txt; exit 1
          }
          if ! grep -q "$ALIAS" /tmp/ks_list.txt; then
            echo "::error::Alias '$ALIAS' not found in the keystore. Check the KEY_ALIAS secret."
            cat /tmp/ks_list.txt; exit 1
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "${KEY_PASS:-$STORE_PASS}" "$ALIAS" > keystore.properties
          echo "Release keystore configured (alias=$ALIAS)"

      - name: Build
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-configuration-cache

      # Git ref rules: no spaces/~^:?*[\, no leading ./-, no trailing ., no "..", non-empty.
      - name: Sanitize tag
        id: sanitize
        run: |
          RAW="${{ inputs.name }}"
          TAG="$(printf '%s' "$RAW" | sed 's/[^A-Za-z0-9._-]/-/g; s/\.\.//g; s/^-*//; s/[-.]*$//')"
          if [ -z "$TAG" ]; then TAG="release-$(date +%Y%m%d%H%M%S)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG (from \"$RAW\")"

      - name: Generate release notes (commits)
        run: |
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          {
            echo "## Commits"
            echo ""
            git log "$RANGE" --oneline --format='* %h %s'
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.sanitize.outputs.tag }}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "${{ inputs.name }}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"
